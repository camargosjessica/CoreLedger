# This workflow builds and tests the Swift packages of the CoreLedger monorepo.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    strategy:
      fail-fast: false
      matrix:
        package: [Kaus-Media, Kaus-Australis]
    # Postgres para os testes de integração do backend (Kaus-Australis).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kaus_user
          POSTGRES_PASSWORD: kaus_password
          POSTGRES_DB: kaus_test
        options: >-
          --health-cmd "pg_isready -U kaus_user -d kaus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: postgres
      DATABASE_USERNAME: kaus_user
      DATABASE_PASSWORD: kaus_password
      DATABASE_TEST_NAME: kaus_test
      KAUS_INTEGRATION_TESTS: ${{ matrix.package == 'Kaus-Australis' && '1' || '0' }}
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
      working-directory: ${{ matrix.package }}
    - name: Run tests
      run: swift test -v
      working-directory: ${{ matrix.package }}
